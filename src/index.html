<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uhrwerk</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'sha256-+mly31C+QQSAeXrtrKLIXFjPzAin+3Nu2O5/lqJcZv8='; style-src 'self' 'unsafe-inline'; img-src 'self' app: data: blob:; connect-src 'self' app: ws: wss:">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>
/* Layout: Vollbild-3D. Menüs als zentrierte Tafel, im Spiel nur Ecken-HUD, Fadenkreuz und Hinweiszeile.
   Ein Look: Uhrmacherwerkstatt bei Nacht. Dunkles Nussholz, Messing als Akzent, Papier für Dokumente.
   Bewusst nur lokale Schriften (Georgia/Palatino), damit die Desktop-App offline gleich aussieht. */
:root {
  --nacht: #0d0b09;
  --holz: #1a1410;
  --holz-2: #241b14;
  --linie: #4a3a26;
  --text: #f0e6d2;
  --leise: #a8987c;
  --messing: #d4a94e;
  --messing-text: #1c1303;
  --papier: #efe4c8;
  --tinte: #2a2116;
  --gefahr: #e0533d;
  --gut: #8fd19e;
  --f-titel: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-text: Georgia, "Palatino Linotype", serif;
  --f-mono: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--nacht); color: var(--text); font: 17px/1.5 var(--f-text); overflow: hidden; user-select: none; }
canvas#welt { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; }
.knopf { font: 600 16px var(--f-titel); letter-spacing: .04em; border-radius: 6px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--linie); background: var(--holz-2); color: var(--text); text-align: center; transition: border-color .15s, background .15s; }
.knopf:hover:not(:disabled) { border-color: var(--messing); }
.knopf.haupt { background: linear-gradient(180deg, #e2bc66, #b98d36); color: var(--messing-text); border-color: #e2bc66; }
.knopf:disabled { opacity: .45; cursor: default; }
.knopf:focus-visible, input:focus-visible { outline: 2px solid var(--messing); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-titel); margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
.leise { color: var(--leise); }

/* Menütafel */
.menue { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: radial-gradient(80% 70% at 50% 30%, rgba(212, 169, 78, .10), transparent 70%), rgba(13, 11, 9, .82); overflow-y: auto; }
.tafel { width: min(560px, 100%); display: grid; gap: 18px; padding: 32px; background: linear-gradient(180deg, var(--holz-2), var(--holz)); border: 1px solid var(--linie); border-radius: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .04); }
.titel { font: 700 clamp(52px, 8vw, 84px)/0.95 var(--f-titel); letter-spacing: .06em; color: var(--messing); text-shadow: 0 2px 0 #5a4010, 0 0 30px rgba(212, 169, 78, .25); }
.unter { font-style: italic; color: var(--leise); }
.stapel { display: grid; gap: 10px; }
.zeile { display: flex; gap: 10px; flex-wrap: wrap; }
.zeile > .knopf { flex: 1 1 160px; }
.code { font: 700 56px/1 var(--f-mono); letter-spacing: .25em; text-align: center; color: var(--messing); padding: 6px 0; }
input.feld { font: 700 26px var(--f-mono); letter-spacing: .25em; text-transform: uppercase; text-align: center; width: 100%; color: var(--text); background: var(--nacht); border: 1px solid var(--linie); border-radius: 6px; padding: 12px; }
.meldung { font-size: 15px; min-height: 1.4em; }
.meldung.fehler { color: var(--gefahr); }
.spieler { display: grid; gap: 8px; }
.spieler div { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--linie); border-radius: 6px; background: rgba(0, 0, 0, .2); }
.spieler b { font-family: var(--f-titel); }
.pille { font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pille.an { color: var(--gut); } .pille.aus { color: var(--leise); }
.rollen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rolle { text-align: left; padding: 14px; border-radius: 8px; border: 1px solid var(--linie); background: rgba(0, 0, 0, .2); color: var(--text); cursor: pointer; display: grid; gap: 4px; }
.rolle b { font: 700 18px var(--f-titel); }
.rolle span { font-size: 14px; color: var(--leise); }
.rolle[aria-pressed="true"] { border-color: var(--messing); box-shadow: 0 0 0 1px var(--messing) inset; }
.rolle:disabled { cursor: default; }
.regler { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; }
.regler input[type=range] { grid-column: 1 / -1; accent-color: var(--messing); }
.regler output { font-family: var(--f-mono); color: var(--leise); }
.tasten { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
kbd { font: 600 13px var(--f-mono); border: 1px solid var(--linie); border-bottom-width: 3px; border-radius: 4px; padding: 1px 7px; background: var(--nacht); color: var(--text); }

/* HUD */
.hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.hud .links { position: absolute; left: 24px; top: 20px; display: grid; gap: 6px; max-width: 420px; }
.hud .rolle-name { font: 700 22px var(--f-titel); color: var(--messing); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.hud .auftrag { font-size: 15px; color: var(--text); text-shadow: 0 1px 6px rgba(0, 0, 0, .9); }
.hud .rechts { position: absolute; right: 24px; top: 16px; text-align: right; }
.hud .uhr { font: 700 40px/1 var(--f-mono); color: var(--text); text-shadow: 0 2px 10px rgba(0, 0, 0, .8); font-variant-numeric: tabular-nums; }
.hud .rest { font-size: 14px; color: var(--leise); }
.hud .rest.knapp { color: var(--gefahr); }
.hud .partner { font-size: 13px; color: var(--leise); margin-top: 6px; }
.kreuz { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; }
.kreuz::before, .kreuz::after { content: ""; position: absolute; background: rgba(240, 230, 210, .7); }
.kreuz::before { left: 10px; top: 4px; width: 2px; height: 14px; } .kreuz::after { top: 10px; left: 4px; height: 2px; width: 14px; }
.kreuz.ziel::before, .kreuz.ziel::after { background: var(--messing); }
.hinweis { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font: 600 16px var(--f-titel); padding: 6px 14px; border-radius: 6px; background: rgba(13, 11, 9, .7); border: 1px solid var(--linie); white-space: nowrap; }
.hinweis kbd { margin-right: 6px; }
.toasts { position: absolute; left: 50%; top: 90px; transform: translateX(-50%); display: grid; gap: 8px; width: min(560px, 90vw); }
.toast { padding: 10px 16px; border-radius: 8px; background: rgba(26, 20, 16, .92); border: 1px solid var(--linie); border-left: 3px solid var(--messing); font-size: 15px; animation: rein .3s ease-out; }
.toast.schlecht { border-left-color: var(--gefahr); }
@keyframes rein { from { opacity: 0; transform: translateY(-8px); } }
.strafe { position: absolute; right: 30px; top: 74px; font: 700 26px var(--f-mono); color: var(--gefahr); opacity: 0; }
.strafe.an { animation: strafe 1.4s ease-out; }
@keyframes strafe { 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
.tastenleiste { position: absolute; left: 24px; bottom: 20px; font-size: 13px; color: var(--leise); display: flex; gap: 14px; flex-wrap: wrap; }

/* Dokumente */
.dokument { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; padding: 24px; background: rgba(5, 4, 3, .75); }
.blatt { width: min(620px, 100%); max-height: 100%; overflow-y: auto; background: var(--papier); color: var(--tinte); border-radius: 4px; padding: 30px 34px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7), inset 0 0 80px rgba(120, 90, 40, .22); display: grid; gap: 14px; }
.blatt h2 { font-size: 28px; }
.blatt .hand { font-style: italic; font-size: 18px; line-height: 1.6; }
.blatt canvas { width: 100%; height: auto; display: block; }
.blatt .knopf { color: var(--text); }
.blatt .zeile { justify-content: flex-end; }
.stellen { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; justify-items: center; }
.drehfeld { display: grid; gap: 6px; justify-items: center; }
.drehfeld output { font: 700 48px var(--f-mono); color: var(--tinte); min-width: 2.4ch; text-align: center; }
.drehfeld .knopf { padding: 6px 18px; }
.drehfeld span { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
.verbindung { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(5, 4, 3, .85); }
@media (prefers-reduced-motion: reduce) { .toast, .strafe.an { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="welt"></canvas>

<div class="hud" id="hud" hidden>
  <div class="links"><div class="rolle-name" id="hud-rolle"></div><div class="auftrag" id="hud-auftrag"></div></div>
  <div class="rechts"><div class="uhr" id="hud-uhr">23:40:00</div><div class="rest" id="hud-rest"></div><div class="partner" id="hud-partner"></div></div>
  <div class="strafe" id="hud-strafe">−20 s</div>
  <div class="kreuz" id="kreuz"></div>
  <div class="hinweis" id="hinweis" hidden></div>
  <div class="toasts" id="toasts"></div>
  <div class="tastenleiste"><span><kbd>WASD</kbd> laufen</span><span><kbd>E</kbd> benutzen</span><span><kbd>Q</kbd> markieren</span><span><kbd>Esc</kbd> Menü</span></div>
</div>

<div class="dokument" id="dokument" hidden><div class="blatt" id="blatt"></div></div>
<section class="menue" id="menue"><div class="tafel" id="tafel"></div></section>
<div class="verbindung" id="verbindung" hidden><div class="tafel"><h2>Verbindung verloren</h2><p class="leise">Dein Partner ist nicht mehr da.</p><button class="knopf haupt" id="zumMenue">Zum Hauptmenü</button></div></div>

<script type="module" src="./main.js"></script>
</body>
</html>
